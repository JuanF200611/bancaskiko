<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Completos | Bancas Kiko</title>
    <link rel="icon" type="image/png" href="nuevologo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --azul-rey: #0033a0;
            --azul-oscuro: #001f5c;
            --rojo: #d90000;
            --dorado: #ffcc00;
            --blanco: #ffffff;
            --gris-fondo: #f4f7f6;
            --texto-oscuro: #1e293b;
            --texto-gris: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(180deg, #00123a 0%, var(--azul-oscuro) 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============================================================
           HEADER
        ============================================================ */
        header {
            background: linear-gradient(90deg, var(--azul-oscuro) 0%, var(--azul-rey) 100%);
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--dorado);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            gap: 15px;
        }

        .btn-back {
            color: white;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            padding: 10px 18px;
            border-radius: 30px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.2);
            transition: 0.3s;
            white-space: nowrap;
        }
        .btn-back:hover {
            background: var(--dorado);
            color: var(--azul-oscuro);
            border-color: var(--dorado);
            transform: translateX(-3px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .logo-container img {
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-title {
            font-size: 18px;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .logo-title span { color: var(--dorado); }
        .logo-slogan {
            font-size: 9px;
            color: #cbd5e1;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .header-spacer { width: 150px; }

        /* ============================================================
           HERO
        ============================================================ */
        .hero {
            padding: 50px 5% 30px;
            text-align: center;
        }
        .hero h1 {
            font-size: 36px;
            color: var(--dorado);
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }
        .hero .subtitle {
            color: #cbd5e1;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* ============================================================
           CONTROLES DE BÚSQUEDA
        ============================================================ */
        .search-panel {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            padding: 22px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.12);
            max-width: 780px;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .date-search {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .date-search input {
            flex: 1;
            border: none;
            padding: 14px 22px;
            border-radius: 30px;
            font-size: 15px;
            font-family: inherit;
            font-weight: 700;
            color: var(--azul-rey);
            outline: none;
            background: white;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.08);
            transition: 0.3s;
        }
        .date-search input:focus {
            box-shadow: 0 0 0 3px var(--dorado), inset 0 2px 5px rgba(0,0,0,0.08);
        }

        .btn-search {
            background: var(--rojo);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(217,0,0,0.35);
            white-space: nowrap;
        }
        .btn-search:hover {
            background: #b30000;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(217,0,0,0.5);
        }

        .quick-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .chip {
            background: rgba(255,255,255,0.08);
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .chip:hover {
            border-color: var(--dorado);
            color: var(--dorado);
            background: rgba(255,204,0,0.08);
        }
        .chip.active {
            background: var(--dorado);
            border-color: var(--dorado);
            color: var(--azul-oscuro);
            box-shadow: 0 5px 15px rgba(255,204,0,0.4);
        }

        /* ============================================================
           FILTROS DE CATEGORÍA
        ============================================================ */
        .category-filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 5% 25px;
        }
        .btn-cat {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.25);
            color: white;
            padding: 10px 26px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .btn-cat:hover {
            border-color: var(--dorado);
            color: var(--dorado);
        }
        .btn-cat.active {
            background: var(--dorado);
            border-color: var(--dorado);
            color: var(--azul-oscuro);
            box-shadow: 0 5px 15px rgba(255,204,0,0.4);
        }

        /* ============================================================
           INFO DE RESULTADOS (CONTADOR)
        ============================================================ */
        .results-info {
            text-align: center;
            margin-bottom: 25px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
        }
        .results-info strong {
            color: var(--dorado);
            font-size: 17px;
        }

        /* ============================================================
           GRID DE RESULTADOS
        ============================================================ */
        .grid-loterias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 5%;
        }

        .card-loteria {
            background: white;
            border-radius: 20px;
            padding: 25px 20px;
            color: var(--texto-oscuro);
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            animation: fadeInUp 0.4s ease both;
        }
        .card-loteria:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }
        .card-loteria::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 6px;
            background: linear-gradient(90deg, var(--dorado), #ffb700);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-loteria img {
            height: 70px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.15));
        }

        .loteria-nombre {
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--azul-rey);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bolos-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .bolo {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 26px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            box-shadow:
                inset -4px -4px 10px rgba(0,0,0,0.2),
                inset 3px 3px 8px rgba(255,255,255,0.6),
                0 5px 15px rgba(0,0,0,0.2);
        }
        .bolo.hoy { background: radial-gradient(circle at 30% 30%, #60a5fa, #1e40af); color: white; }
        .bolo.ayer { background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1); color: var(--azul-oscuro); }

        .fecha-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--gris-fondo);
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            color: var(--texto-gris);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           ESTADO VACÍO
        ============================================================ */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }
        .empty-state i {
            font-size: 70px;
            color: rgba(255,204,0,0.5);
            margin-bottom: 20px;
            display: block;
        }
        .empty-state h3 {
            color: white;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .empty-state p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* ============================================================
           SKELETON LOADING
        ============================================================ */
        .skeleton-card {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            height: 260px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ============================================================
           FOOTER
        ============================================================ */
        footer {
            background: #000814;
            color: #94a3b8;
            text-align: center;
            padding: 30px 20px;
            font-size: 13px;
            border-top: 4px solid var(--rojo);
        }
        footer strong { color: var(--dorado); font-size: 15px; }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 768px) {
            header { padding: 10px 4%; }
            .btn-back { font-size: 12px; padding: 8px 14px; }
            .btn-back span { display: none; }
            .btn-back i { font-size: 16px; }
            .logo-title { font-size: 14px; }
            .logo-slogan { font-size: 8px; }
            .logo-container img { height: 40px; }
            .header-spacer { display: none; }

            .hero { padding: 30px 5% 20px; }
            .hero h1 { font-size: 24px; }
            .hero .subtitle { font-size: 13px; }

            .search-panel { padding: 15px; }
            .date-search { flex-direction: column; }
            .date-search input, .btn-search { width: 100%; justify-content: center; }

            .quick-chips { gap: 8px; }
            .chip { padding: 8px 16px; font-size: 12px; }

            .category-filters { margin: 20px 5%; gap: 8px; }
            .btn-cat { padding: 8px 18px; font-size: 12px; }

            .grid-loterias {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 0 4%;
            }
            .bolo { width: 55px; height: 55px; font-size: 22px; }
            .card-loteria { padding: 20px 15px; }
        }

        @media (max-width: 420px) {
            .logo-title { font-size: 12px; }
            .logo-container img { height: 34px; }
            .bolo { width: 50px; height: 50px; font-size: 20px; }
            .hero h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            <span>Volver al Inicio</span>
        </a>

        <a href="index.html" class="logo-container">
            <img src="nuevologo.png" alt="Bancas Kiko">
            <div class="logo-text">
                <div class="logo-title">Bancas <span>Kiko</span></div>
                <div class="logo-slogan">La confianza en tu jugada</div>
            </div>
        </a>

        <div class="header-spacer"></div>
    </header>

    <!-- HERO + BÚSQUEDA -->
    <div class="hero">
        <h1>Todos los Resultados</h1>
        <p class="subtitle">Consulta los sorteos por fecha y categoría</p>

        <div class="search-panel">
            <div class="date-search">
                <input type="date" id="searchDate">
                <button class="btn-search" onclick="buscarPorFecha()">
                    <i class="fas fa-search"></i> Buscar
                </button>
            </div>
            <div class="quick-chips">
                <button class="chip active" id="chipHoy" onclick="verHoy()">
                    <i class="fas fa-calendar-day"></i> Hoy
                </button>
                <button class="chip" id="chipAyer" onclick="verAyer()">
                    <i class="fas fa-calendar-minus"></i> Ayer
                </button>
                <button class="chip" id="chipAnteayer" onclick="verAnteayer()">
                    <i class="fas fa-calendar-alt"></i> Anteayer
                </button>
            </div>
        </div>
    </div>

    <!-- FILTROS DE CATEGORÍA -->
    <div class="category-filters" id="filtrosCategoria">
        <button class="btn-cat active" data-cat="todas" onclick="filtrarCategoria('todas', this)">
            <i class="fas fa-list"></i> Todas
        </button>
        <button class="btn-cat" data-cat="dominicana" onclick="filtrarCategoria('dominicana', this)">
            <i class="fas fa-flag"></i> Dominicanas
        </button>
        <button class="btn-cat" data-cat="extranjera" onclick="filtrarCategoria('extranjera', this)">
            <i class="fas fa-globe"></i> Extranjeras
        </button>
    </div>

    <!-- INFO CONTADOR -->
    <div class="results-info" id="resultsInfo"></div>

    <!-- GRID -->
    <div class="grid-loterias" id="resultsGrid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; <span id="yearActual"></span> <strong>Bancas Kiko</strong> · Todos los derechos reservados</p>
        <p style="margin-top: 6px; font-size: 11px; color: #64748b;">La confianza en tu jugada · Prohibido para menores de edad</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        /* ============================================================
           CONFIGURACIÓN FIREBASE
        ============================================================ */
        const firebaseConfig = { databaseURL: "https://pizarra-loteria-36ba5-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let TODOS_LOS_RESULTADOS = [];
        let LOGOS = {};
        let resultadosFiltradosGlobal = [];
        let categoriaActiva = 'todas';
        let fechaActiva = '';

        /* ============================================================
           ACTUALIZAR AÑO AUTOMÁTICAMENTE
        ============================================================ */
        document.getElementById('yearActual').textContent = new Date().getFullYear();

        /* ============================================================
           HELPERS DE FECHA (CORREGIDO PARA ZONA HORARIA DE RD)
        ============================================================ */
        function getFechaStr(offsetDias = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDias);
            
            // Usamos getFullYear, getMonth y getDate para obtener la fecha LOCAL
            // Evitamos toISOString() para que no convierta a UTC y nos reste horas.
            const año = d.getFullYear();
            const mes = String(d.getMonth() + 1).padStart(2, '0'); // Los meses van de 0 a 11
            const dia = String(d.getDate()).padStart(2, '0');
            
            return `${año}-${mes}-${dia}`;
        }

        /* ============================================================
           CARGA DE DATOS EN TIEMPO REAL
        ============================================================ */
        database.ref('web_kiko/logos').on('value', snap => {
            LOGOS = snap.val() || {};
            renderResultados(getResultadosFiltrados());
        });

        database.ref('sorteos_enloteria/resultados').on('value', snap => {
            TODOS_LOS_RESULTADOS = [];
            if (snap.exists()) snap.forEach(child => {
                const data = child.val();
                if (data) TODOS_LOS_RESULTADOS.push(data);
            });
            TODOS_LOS_RESULTADOS.sort((a, b) => new Date(b.enviadoEn) - new Date(a.enviadoEn));

            // Si aún no se ha seleccionado fecha, cargar "hoy" por defecto
            if (!fechaActiva) {
                verHoy();
            } else {
                // Refrescar con la fecha que ya estaba activa
                resultadosFiltradosGlobal = TODOS_LOS_RESULTADOS.filter(r => r.fechaRD === fechaActiva);
                renderResultados(getResultadosFiltrados());
            }
        });

        /* ============================================================
           NAVEGACIÓN DE FECHAS
        ============================================================ */
        function setFecha(fechaStr, chipId) {
            fechaActiva = fechaStr;
            document.getElementById('searchDate').value = fechaStr;
            resultadosFiltradosGlobal = TODOS_LOS_RESULTADOS.filter(r => r.fechaRD === fechaStr);

            // Actualizar chips activos
            document.querySelectorAll('.quick-chips .chip').forEach(c => c.classList.remove('active'));
            if (chipId) document.getElementById(chipId).classList.add('active');

            renderResultados(getResultadosFiltrados());
        }

        function verHoy() {
            setFecha(getFechaStr(0), 'chipHoy');
        }

        function verAyer() {
            setFecha(getFechaStr(-1), 'chipAyer');
        }

        function verAnteayer() {
            setFecha(getFechaStr(-2), 'chipAnteayer');
        }

        function buscarPorFecha() {
            const inputDate = document.getElementById('searchDate').value;
            if (!inputDate) return alert('Selecciona una fecha');
            setFecha(inputDate, null);
        }

        /* ============================================================
           FILTROS DE CATEGORÍA
        ============================================================ */
        function filtrarCategoria(cat, btn) {
            categoriaActiva = cat;

            document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderResultados(getResultadosFiltrados());
        }

        function getResultadosFiltrados() {
            if (categoriaActiva === 'todas') return resultadosFiltradosGlobal;

            return resultadosFiltradosGlobal.filter(r => {
                const c = (r.categoria || '').toLowerCase();
                return c.includes(categoriaActiva);
            });
        }

        /* ============================================================
           RENDER
        ============================================================ */
        function renderResultados(dataArray) {
            const grid = document.getElementById('resultsGrid');
            const info = document.getElementById('resultsInfo');
            const hoyStr = getFechaStr(0); // Ahora devuelve la fecha real de RD

            if (dataArray.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>Sin resultados</h3>
                        <p>No hay sorteos para la fecha o categoría seleccionada.</p>
                    </div>
                `;
                info.innerHTML = '';
                return;
            }

            info.innerHTML = `Mostrando <strong>${dataArray.length}</strong> resultado${dataArray.length !== 1 ? 's' : ''}`;

            grid.innerHTML = '';
            dataArray.forEach((r, i) => {
                const logoUrl = getLogo(r.nombre);
                const nums = r.numeros || ['--','--','--'];
                const esHoy = r.fechaRD === hoyStr;
                const boloClass = esHoy ? 'hoy' : 'ayer';

                grid.innerHTML += `
                    <div class="card-loteria" style="animation-delay: ${i * 40}ms;">
                        ${logoUrl
                            ? `<img src="${logoUrl}" onerror="this.style.display='none'">`
                            : `<div class="loteria-nombre" style="height:70px; display:flex; align-items:center; justify-content:center;">${r.nombre}</div>`}
                        <div class="loteria-nombre">${r.nombre}</div>
                        <div class="bolos-container">
                            <div class="bolo ${boloClass}">${nums[0]}</div>
                            <div class="bolo ${boloClass}">${nums[1]}</div>
                            <div class="bolo ${boloClass}">${nums[2]}</div>
                        </div>
                        <div class="fecha-tag">
                            <i class="far fa-calendar"></i>
                            ${esHoy ? 'HOY' : (r.fecha || 'DÍA ANT.')} · ${r.hora || ''}
                        </div>
                    </div>
                `;
            });
        }

        /* ============================================================
           LOGOS HELPER
        ============================================================ */
        function getLogo(nombre) {
            if (!nombre) return '';
            if (LOGOS[nombre]) return LOGOS[nombre];
            const n = nombre.toLowerCase();
            for (const [k, v] of Object.entries(LOGOS)) {
                if (k === '_default') continue;
                if (n.includes(k.toLowerCase()) || k.toLowerCase().includes(n)) return v;
            }
            return LOGOS['_default'] || '';
        }
    </script>
</body>
</html>
